name: Nandim Music Android APK
on:
  push:
    branches: [build-nandim-music-20261116]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p nandim-music :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NandimMusic-APK
          path: nandim-music/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK para download direto
        run: |
          cp nandim-music/app/build/outputs/apk/debug/app-debug.apk NandimMusic.apk
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NandimMusic.apk
          git commit -m "APK instalável Nandim Music"
          git push origin HEAD:build-nandim-music-20261116
